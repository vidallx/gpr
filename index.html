<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gym Tracker Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C23D55">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <img src="gim.png" alt="Logo" class="logo">
        <h1>Gym Tracker Pro</h1>
        <h6 style="color: rgba(255,255,255,0.7); font-weight: normal; font-size: 14px;">by Vidal</h6>
    </header>

    <main>
        <!-- LOGIN -->
        <section id="login-section" class="interface active">
            <div class="card">
                <h2>Bienvenido</h2>
                <input type="email" id="login-email" placeholder="Correo electrónico">
                <input type="password" id="login-password" placeholder="Contraseña">
                <button class="primary-btn" onclick="login()">Iniciar Sesión</button>
                <p class="divider">o</p>
                <button class="secondary" onclick="showInterface('register-section')">Registrar Nuevo Usuario</button>
                <p id="auth-message" class="message"></p>
            </div>
        </section>

        <!-- REGISTRO -->
        <section id="register-section" class="interface">
            <div class="card">
                <h2>Crear Cuenta</h2>
                <input type="text" id="user-name" placeholder="Tu nombre">
                <input type="email" id="register-email" placeholder="Correo electrónico">
                <input type="password" id="register-password" placeholder="Contraseña (mín 6)">
                <input type="password" id="register-password-confirm" placeholder="Confirmar contraseña">
                <button class="primary-btn" onclick="register()">Crear Cuenta</button>
                <button class="secondary" onclick="showInterface('login-section')">⬅ Volver</button>
                <p id="register-message" class="message"></p>
            </div>
        </section>

        <!-- PROGRAMADOR -->
        <section id="programmer-section" class="interface">
            <div class="card">
                <h2>Programar Rutina</h2>
                <div class="row" style="margin-bottom:15px;">
                    <button class="secondary" onclick="showScheduledRoutines()">📅 Mis Rutinas</button>
                    <button class="secondary" onclick="showInterface('history-section')">📜 Historial</button>
                </div>
                <label class="sub-title">📅 Programar para el día:</label>
                <select id="routine-day">
                    <option>Lunes</option><option>Martes</option><option>Miércoles</option>
                    <option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
                </select>
                <p id="routine-day-info" style="font-size: 13px; margin-bottom: 15px;"></p>
                
                <label class="sub-title">Tipo de Entrenamiento:</label>
                <select id="body-part">
                    <option>Tren Superior</option><option>Tren Inferior</option><option>Full Body</option>
                </select>
                <label class="sub-title">⏱️ Descanso entre ejercicios (minutos):</label>
                <input type="number" id="rest-ex-global" placeholder="Minutos" min="0">
                
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
                <h3 style="text-align:center; color:#0C047D;">Añadir Ejercicio</h3>
                <input type="text" id="ex-name" placeholder="Nombre del ejercicio">
                <div class="row">
                    <input type="number" id="ex-sets" placeholder="Series" min="1">
                    <input type="number" id="ex-reps" placeholder="Reps" min="1">
                    <input type="text" id="ex-weight" placeholder="Peso (ej: 20kg)">
                </div>
                
                <label class="sub-title">Equipamiento y Cantidad:</label>
                <div class="row">
                    <select id="ex-equipment">
                        <option>Sin equipo</option><option>Mancuernas</option><option>Barras</option>
                        <option>Pesas rusas</option><option>Bandas</option><option>Máquinas</option>
                    </select>
                    <select id="ex-quantity">
                        <option value="2">2 (Simultáneo)</option>
                        <option value="1">1 (Unilateral)</option>
                    </select>
                </div>

                <!-- 🆕 PRESETS DE TEMPO -->
                <label class="sub-title">Tempo Rápido (Presets):</label>
                <div class="tempo-presets">
                    <button type="button" class="preset-btn" onclick="applyTempoPreset(3,1,1,0)">3-1-1-0</button>
                    <button type="button" class="preset-btn" onclick="applyTempoPreset(2,0,2,0)">2-0-2-0</button>
                    <button type="button" class="preset-btn" onclick="applyTempoPreset(4,0,1,0)">4-0-1-0</button>
                    <button type="button" class="preset-btn" onclick="applyTempoPreset(3,0,'X',0)">3-0-X-0</button>
                </div>

                <label class="sub-title">Tempo Manual (segundos):</label>
                <div class="row">
                    <input type="number" id="tempo-ecc" placeholder="Ecc" min="0">
                    <input type="number" id="tempo-pb" placeholder="P.Abajo" min="0">
                    <!-- 🆕 CAMPO DE TEXTO PARA PERMITIR "X" -->
                    <input type="text" id="tempo-con" placeholder="Con (o X)" min="0">
                    <input type="number" id="tempo-pt" placeholder="P.Arriba" min="0">
                </div>
                <small style="color:#666; display:block; margin-bottom:10px;">* Usa "X" en el Concéntrico para movimiento explosivo.</small>

                <label class="sub-title">Descanso entre series (segundos):</label>
                <input type="number" id="rest-set" placeholder="Segundos" min="0">
                <button class="primary-btn" onclick="addExercise()">Añadir Ejercicio</button>
                
                <div class="summary-box">
                    <strong>Tiempo total estimado:</strong> <span id="total-time-display">00:00</span>
                    <ul id="exercise-list"></ul>
                </div>
                <button class="primary-btn" onclick="saveAndStartRoutine()">💾 Guardar e Iniciar</button>
                <button class="secondary" onclick="saveRoutineOnly()">📥 Solo Guardar</button>
            </div>
        </section>

        <!-- MIS RUTINAS -->
        <section id="scheduled-routines-section" class="interface">
            <div class="card">
                <h2>📅 Mis Rutinas</h2>
                <button class="secondary" onclick="showInterface('programmer-section')">⬅ Volver</button>
                <div id="scheduled-routines-list" style="margin-top:15px;"></div>
            </div>
        </section>

        <!-- EJECUTOR -->
        <section id="executor-section" class="interface">
            <div class="card minimalist">
                <h2 id="current-phase-title">Preparación</h2>
                <div class="progress-container">
                    <svg class="progress-ring" width="200" height="200">
                        <circle class="progress-ring__circle-bg" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="transparent" r="90" cx="100" cy="100"/>
                        <circle class="progress-ring__circle" stroke="#ffffff" stroke-width="12" fill="transparent" r="90" cx="100" cy="100"/>
                    </svg>
                    <div class="timer-display">
                        <span id="timer-seconds">00</span>s
                    </div>
                </div>
                <div class="controls">
                    <button id="btn-start-pause" class="primary-btn" onclick="toggleTimer()">Iniciar</button>
                    <button class="danger" onclick="finishRoutine()">Finalizar</button>
                </div>
                <button class="history-btn" onclick="pauseAndExit()">⏸️ Pausar y Salir</button>
            </div>
        </section>

        <!-- HISTORIAL -->
        <section id="history-section" class="interface">
            <div class="card">
                <h2>📜 Historial</h2>
                <button class="secondary" onclick="showInterface('programmer-section')">⬅ Volver</button>
                <div id="history-stats" class="stats-container"></div>
                <div id="history-list"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
